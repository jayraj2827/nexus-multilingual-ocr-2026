<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusOCR — Multilingual Document OCR</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Top Navigation -->
        <header class="navbar">
            <div class="brand">
                <div class="logo-icon">⚡</div>
                <h1>Nexus<span>OCR</span></h1>
                <span class="badge cpu-badge">CPU-First Engine</span>
            </div>
            <div class="nav-metrics" id="headerMetrics">
                <div class="metric-item">
                    <span class="metric-label">Latency:</span>
                    <span class="metric-value" id="totalLatency">- ms</span>
                </div>
                <div class="metric-item">
                    <span class="metric-label">Pages:</span>
                    <span class="metric-value" id="totalPages">-</span>
                </div>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="main-content">
            <!-- Left: Upload & Document Preview -->
            <section class="panel left-panel">
                <div class="panel-header">
                    <h2>Upload Document</h2>
                    <span class="subtext">English, Hindi, Gujarati, Tables & Scans</span>
                </div>

                <div class="dropzone" id="dropzone">
                    <input type="file" id="fileInput" accept=".pdf" class="file-input">
                    <div class="dropzone-content">
                        <div class="upload-icon">📄</div>
                        <p class="dropzone-text"><strong>Drag & Drop PDF here</strong> or <span>Browse</span></p>
                        <p class="file-info" id="selectedFileInfo">Select any PDF to extract text</p>
                    </div>
                </div>

                <div class="action-section">
                    <button class="btn-primary" id="processBtn">Extract Text</button>
                </div>

                <!-- Page Navigator -->
                <div class="page-navigator" id="pageNavigator" style="display: none;">
                    <button class="btn-page" id="prevPageBtn">◀ Prev</button>
                    <span id="pageIndicator">Page 1 / 1</span>
                    <button class="btn-page" id="nextPageBtn">Next ▶</button>
                </div>

                <!-- Document Image Preview -->
                <div class="preview-container" id="previewContainer" style="display: none;">
                    <div class="canvas-wrapper">
                        <img id="pageImage" class="page-image" alt="Page View">
                        <div id="bboxOverlay" class="bbox-overlay"></div>
                    </div>
                </div>
            </section>

            <!-- Right: Textual Output View -->
            <section class="panel right-panel">
                <div class="panel-header">
                    <h2>Extracted Text</h2>
                    <div class="header-actions">
                        <button class="btn-copy" onclick="copyExtractedText()">Copy Text</button>
                    </div>
                </div>

                <div class="text-output-wrapper">
                    <pre class="content-box" id="markdownContent">Upload a PDF document to view extracted text...</pre>
                </div>
            </section>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
